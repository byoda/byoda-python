[project]
name = "byoda-python"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "aioschedule @ git+https://github.com/ibrb/python-aioschedule",
    "aiosqlite",
    "anyio",
    "azure-communication-email",
    "azure-identity",
    "azure-mgmt-communication",
    "azure-storage-blob",
    "beautifulsoup4",
    "bgutil-ytdlp-pot-provider",
    "boto3",
    "cd",
    "certbot",
    "country-converter",
    "cryptography==49.0.0",
    "dnspython",
    "fastapi==0.138.0",
    "fastapi-limiter",
    "google-api-python-client",
    "google-cloud-storage",
    "gunicorn==26.0.0",
    "h11>=0.16.0",
    "httptools",
    "httpcore>=1.0,<2.0",
    "httpx>=0.25,<0.28",
    "httpx2",
    "inotify",
    "innertube",
    "jinja2",
    "opentelemetry-api",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-prometheus",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-sqlite3",
    "opentelemetry-sdk",
    "orjson",
    "passgen",
    "passlib[argon2]",
    "prometheus-client",
    "prometheus-fastapi-instrumentator",
    "profanity-check",
    "psycopg[binary]",
    "psycopg-pool",
    "pydantic==2.13.4",
    "pyjwt",
    "pymerkle",
    "pynng",
    "python-dateutil",
    "python-json-logger",
    "python-multipart",
    "pyyaml",
    "redis[hiredis]",
    "starlette==1.3.1",
    "starlette-context",
    "typing-extensions",
    "urllib3>=2.6.0",
    "uvicorn[standard]",
    "uvloop",
    "websockets",
    "yt-dlp[default]",
]

[dependency-groups]
dev = [
    "coverage>=7.14.3",
    "deprecated",
    "flake8",
    "perflint",
    "setuptools",
    "wheel",
]

[tool.uv]
package = false
override-dependencies = [
    "httpx>=0.25,<0.28",
]
