---
# Examples:
#   docker compose up -d directory
#   SERVICE_ID=32768 SERVICE_PORT=8011 docker compose up -d service
#
# The service key replaces the first argument to docker-launch.sh. Environment
# variables can be set in the shell or in a .env file next to this file.

x-byoda-common: &byoda-common
  restart: unless-stopped
  pull_policy: always
  environment: &byoda-environment
    LOGLEVEL: ${LOGLEVEL:-INFO}
    WORKERS: ${WORKERS:-2}

services:
  directory:
    <<: *byoda-common
    image: byoda/byoda-directory:${TAG:-latest}
    container_name: byoda-directory
    environment:
      <<: *byoda-environment
      SERVER_CONTAINER: byoda-directory.${BYODA_DOMAIN:-byoda.net}
    ports:
      - "${DIRECTORY_PORT:-8030}:8000"
    volumes:
      - ${LOG_DIR:-/var/log/byoda}:/var/log/byoda
      - ${BYODA_HOME:-/opt/byoda}/dirserver:${BYODA_HOME:-/opt/byoda}/dirserver
      - ${BYODA_HOME:-/opt/byoda}/dirserver/config.yml:/podserver/byoda-python/config.yml

  service:
    <<: *byoda-common
    image: byoda/byoda-service:${TAG:-latest}
    container_name: byoda-${SERVICE_ID:-16384}
    environment:
      <<: *byoda-environment
      SERVER_CONTAINER: byoda-${SERVICE_ID:-16384}.${BYODA_DOMAIN:-byoda.net}
    ports:
      - "${SERVICE_PORT:-8010}:8000"
    volumes:
      - ${LOG_DIR:-/var/log/byoda}:/var/log/byoda
      - ${BYODA_HOME:-/opt/byoda}/service-${SERVICE_ID:-16384}:${BYODA_HOME:-/opt/byoda}/service-${SERVICE_ID:-16384}
      - ${BYODA_HOME:-/opt/byoda}/service-${SERVICE_ID:-16384}/config.yml:/podserver/byoda-python/config.yml

  worker:
    <<: *byoda-common
    image: byoda/byoda-serviceworker:${TAG:-latest}
    container_name: byoda-worker
    environment:
      <<: *byoda-environment
      SERVER_CONTAINER: byoda-worker.${BYODA_DOMAIN:-byoda.net}
    volumes:
      - ${LOG_DIR:-/var/log/byoda}:/var/log/byoda
      - ${BYODA_HOME:-/opt/byoda}/service-${SERVICE_ID:-16384}:${BYODA_HOME:-/opt/byoda}/service-${SERVICE_ID:-16384}
      - ${BYODA_HOME:-/opt/byoda}/service-16384/config.yml:/podserver/byoda-python/config.yml

  moderate:
    <<: *byoda-common
    image: byoda/byoda-app:${TAG:-latest}
    container_name: byoda-moderate
    environment:
      <<: *byoda-environment
      SERVER_CONTAINER: byoda-moderate.${BYODA_DOMAIN:-byoda.net}
    ports:
      - "${MODERATE_PORT:-8020}:8000"
    volumes:
      - ${LOG_DIR:-/var/log/byoda}:/var/log/byoda
      - /var/tmp:/var/tmp
      - ${BYODA_HOME:-/opt/byoda}/modtest:${BYODA_HOME:-/opt/byoda}/modtest
      - ${BYODA_HOME:-/opt/byoda}/config.yml:/podserver/byoda-python/config.yml
      - /usr/share/nginx/mod:/usr/share/nginx/mod
